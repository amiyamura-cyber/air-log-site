.p-thanks__mark{width:64px;height:64px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,#f06292,#d81b60);color:#fff;font-size:2rem;line-height:64px;font-weight:bold}
.p-thanks__title{font-size:1.5rem;color:#222;margin-bottom:16px;text-wrap:balance}
.p-thanks__text{font-size:.98rem;color:#555;margin-bottom:32px}
.p-thanks__btn{display:inline-block;background:linear-gradient(135deg,#f06292,#d81b60);color:#fff;font-weight:bold;padding:14px 40px;border-radius:30px;box-shadow:0 4px 12px rgba(216,27,96,.25)}
.l-footer{background:#263238;color:#cfd8dc;padding:32px 24px;text-align:center;font-size:.8rem}
@media(max-width:480px){.p-thanks__box{padding:36px 20px}.p-thanks__title{font-size:1.25rem}}
